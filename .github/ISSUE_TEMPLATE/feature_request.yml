name: Funktion vorschlagen
description: Eine Idee für Lagerfeuer.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Schau gern vorher in die [Roadmap](https://github.com/Celestial0579/lagerfeuer#roadmap), ob die Idee schon geplant ist.
  - type: textarea
    id: problem
    attributes:
      label: Worum geht es?
      description: Welches Problem soll gelöst werden bzw. was möchtest du tun können?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Wie könnte es aussehen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen / Vorbilder
      description: z.B. wie es die Audiobookshelf-Web-Oberfläche oder die Mobile-App macht.
