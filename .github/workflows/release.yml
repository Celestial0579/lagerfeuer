# Baut Lagerfeuer und veröffentlicht ein GitHub-Release, sobald ein Versions-Tag gepusht wird:
#   git tag v0.2.0 && git push origin v0.2.0
# Ein Tag vX.Y.Z-beta.N wird als Vorabversion veröffentlicht (ohne winget). Der Updater bietet Vorabversionen
# nicht an; wer eine Beta installiert hat, bekommt später die fertige Fassung X.Y.Z angeboten.
# Der eingebaute Updater der App holt sich die Dateien aus diesem Release.
#
# Signiert wird derzeit nicht. Die Schritte „Code-Signing vorbereiten“ und „Signaturzertifikat entfernen“
# setzen ein Zertifikat als Datei voraus (Secrets SIGNING_CERT_PFX_BASE64 und SIGNING_CERT_PASSWORD). Solche
# Dateien geben öffentliche Aussteller seit dem 1.6.2023 nicht mehr aus: Der Schlüssel muss in Hardware oder
# bei einem Signaturdienst liegen. Mit einem heute ausgestellten Zertifikat lassen sich diese Schritte also
# nicht nutzen. Welcher Weg sie ersetzt, ist noch nicht entschieden (README, „Roadmap“).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write     # Build-Provenienz (attest-build-provenance)
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # komplette Historie + Tags für die Release-Notizen

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test --project tests/Lagerfeuer.Tests/Lagerfeuer.Tests.csproj -c Release

      - name: Version aus dem Tag übernehmen
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta\.\d+)?$') { throw "Tag '${{ github.ref_name }}' ist keine Version (vX.Y.Z oder vX.Y.Z-beta.N)." }
          $proj = 'src/Lagerfeuer/Lagerfeuer.csproj'
          (Get-Content $proj -Raw) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" | Set-Content $proj -NoNewline

      - name: NSIS bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Code-Signing vorbereiten (falls Zertifikat hinterlegt)
        if: env.SIGNING_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'lagerfeuer-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          "LAGERFEUER_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Bauen (x64 + ARM64, portable EXE + Setup)
        shell: pwsh
        env:
          LAGERFEUER_SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./build/publish.ps1 -Platform x64,ARM64 -Installer

      - name: Signaturzertifikat entfernen
        if: always() && env.LAGERFEUER_SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item -LiteralPath $env:LAGERFEUER_SIGN_PFX -Force -ErrorAction SilentlyContinue

      - name: Prüfsummen (SHA256SUMS)
        shell: pwsh
        run: |
          # Format wie sha256sum: "<hash>  <datei>", prüfbar mit "sha256sum -c SHA256SUMS".
          $lines = Get-ChildItem artifacts -File -Filter 'Lagerfeuer-*.exe' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path artifacts) 'SHA256SUMS'), (($lines -join "`n") + "`n"))
          Get-Content artifacts/SHA256SUMS

      - name: Build-Provenienz bescheinigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/Lagerfeuer-*.exe'

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ./build/New-ReleaseNotes.ps1 -Tag '${{ github.ref_name }}' | Set-Content $notes -Encoding utf8
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts -File -Filter 'Lagerfeuer-*.exe').FullName (Resolve-Path artifacts/SHA256SUMS).Path `
            --title 'Lagerfeuer ${{ github.ref_name }}' --notes-file $notes @(if ('${{ github.ref_name }}' -like '*-*') { '--prerelease' })

      - name: winget-Manifeste erzeugen
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build/New-WingetManifest.ps1 -Version $version

      - if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: artifacts/winget/
