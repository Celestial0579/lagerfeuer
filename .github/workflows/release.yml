# Baut Lagerfeuer und veröffentlicht ein GitHub-Release, sobald ein Versions-Tag gepusht wird:
#   git tag v0.2.0 && git push origin v0.2.0
# Der eingebaute Updater der App holt sich die Dateien aus diesem Release.
#
# Optionales Code-Signing: Repository-Secrets SIGNING_CERT_PFX_BASE64 (PFX als Base64) und
# SIGNING_CERT_PASSWORD hinterlegen – dann werden App, portable EXE, Setup und Deinstaller signiert.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test --project tests/Lagerfeuer.Tests/Lagerfeuer.Tests.csproj -c Release

      - name: Version aus dem Tag übernehmen
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' ist keine Version (vX.Y.Z)." }
          $proj = 'src/Lagerfeuer/Lagerfeuer.csproj'
          (Get-Content $proj -Raw) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" | Set-Content $proj -NoNewline

      - name: NSIS bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Code-Signing vorbereiten (falls Zertifikat hinterlegt)
        if: env.SIGNING_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'lagerfeuer-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          "LAGERFEUER_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Bauen (x64 + ARM64, portable EXE + Setup)
        shell: pwsh
        env:
          LAGERFEUER_SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./build/publish.ps1 -Platform x64,ARM64 -Installer

      - name: Signaturzertifikat entfernen
        if: always() && env.LAGERFEUER_SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item -LiteralPath $env:LAGERFEUER_SIGN_PFX -Force -ErrorAction SilentlyContinue

      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts -File -Filter 'Lagerfeuer-*.exe').FullName `
            --title 'Lagerfeuer ${{ github.ref_name }}' --generate-notes

      - name: winget-Manifeste erzeugen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build/New-WingetManifest.ps1 -Version $version

      - uses: actions/upload-artifact@v5
        with:
          name: winget-manifests
          path: artifacts/winget/
