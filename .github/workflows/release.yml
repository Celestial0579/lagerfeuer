# Baut Lagerfeuer und veröffentlicht ein GitHub-Release, sobald ein Versions-Tag gepusht wird:
#   git tag v0.2.0 && git push origin v0.2.0
# Ein Tag vX.Y.Z-beta.N wird als Vorabversion veröffentlicht (ohne winget). Der Updater bietet Vorabversionen
# nicht an; wer eine Beta installiert hat, bekommt später die fertige Fassung X.Y.Z angeboten.
# Der eingebaute Updater der App holt sich die Dateien aus diesem Release.
#
# Aufbau (#59): Bauen und Testen laufen ohne Schreibrechte und ohne abgelegtes Token, denn dabei läuft Code aus
# NuGet-Paketen (MSBuild-Targets, Analyzer) und die Tests. Nur der kleine Job „release“ ohne Build darf schreiben:
# Er bescheinigt die fertigen Dateien und legt das Release an. Der Tag-Name kommt nur über die Umgebung in die
# Skripte, nie als Text in den Skriptrumpf, und wird geprüft, bevor ihn etwas verwendet.
#
# Signiert wird derzeit nicht. Die Schritte „Code-Signing vorbereiten“ und „Signaturzertifikat entfernen“
# setzen ein Zertifikat als Datei voraus (Secrets SIGNING_CERT_PFX_BASE64 und SIGNING_CERT_PASSWORD) und laufen
# nur, wenn die Repo-Variable SIGNING_ENABLED auf 'true' steht. Solche Dateien geben öffentliche Aussteller seit
# dem 1.6.2023 nicht mehr aus: Der Schlüssel muss in Hardware oder bei einem Signaturdienst liegen. Mit einem
# heute ausgestellten Zertifikat lassen sich diese Schritte also nicht nutzen. Welcher Weg sie ersetzt, ist noch
# nicht entschieden (README, „Roadmap“).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # komplette Historie + Tags für die Release-Notizen
          persist-credentials: false

      - name: Version aus dem Tag übernehmen
        id: version
        shell: pwsh
        run: |
          # Nur über die Umgebung: Ein Tag darf ' ( ) + ; $ enthalten und käme sonst als Code in dieses Skript.
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '\Av\d+\.\d+\.\d+(-beta\.\d+)?\z') { throw 'Der Tag ist keine Version (vX.Y.Z oder vX.Y.Z-beta.N).' }
          $version = $tag.Substring(1)
          $proj = 'src/Lagerfeuer/Lagerfeuer.csproj'
          (Get-Content $proj -Raw) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" | Set-Content $proj -NoNewline
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test --project tests/Lagerfeuer.Tests/Lagerfeuer.Tests.csproj -c Release

      - name: NSIS bereitstellen
        shell: pwsh
        run: ./build/Install-Nsis.ps1 # feste Version, geprüft über die Prüfsumme (#59)

      - name: Code-Signing vorbereiten (falls eingeschaltet)
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }} # nur in diesem Schritt
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'lagerfeuer-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          "LAGERFEUER_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Bauen (x64 + ARM64, portable EXE + Setup)
        shell: pwsh
        env:
          LAGERFEUER_SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./build/publish.ps1 -Platform x64,ARM64 -Installer

      - name: Signaturzertifikat entfernen
        if: always() && env.LAGERFEUER_SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item -LiteralPath $env:LAGERFEUER_SIGN_PFX -Force -ErrorAction SilentlyContinue

      - name: Prüfsummen (SHA256SUMS)
        shell: pwsh
        run: |
          # Format wie sha256sum: "<hash>  <datei>", prüfbar mit "sha256sum -c SHA256SUMS".
          $lines = Get-ChildItem artifacts -File -Filter 'Lagerfeuer-*.exe' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path artifacts) 'SHA256SUMS'), (($lines -join "`n") + "`n"))
          Get-Content artifacts/SHA256SUMS

      - name: Release-Notizen
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: ./build/New-ReleaseNotes.ps1 -Tag $env:TAG | Set-Content artifacts/release-notes.md -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            artifacts/Lagerfeuer-*.exe
            artifacts/SHA256SUMS
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # Build-Provenienz (attest-build-provenance)
      attestations: write
    steps:
      # Kein Checkout und kein Build: Hier läuft kein Code aus dem Repo oder aus Paketen.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Prüfsummen gegenprüfen
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          test "$(ls Lagerfeuer-*.exe | wc -l)" -eq "$(wc -l < SHA256SUMS)"

      - name: Build-Provenienz bescheinigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/Lagerfeuer-*.exe'

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" release/Lagerfeuer-*.exe release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lagerfeuer $TAG" --notes-file release/release-notes.md "${args[@]}"

  winget:
    needs: [build, release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: winget-Manifeste erzeugen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./build/New-WingetManifest.ps1 -Version ($env:TAG.Substring(1))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: artifacts/winget/
