# Tests und Build bei jedem Push auf main und bei Pull Requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Tests (Lagerfeuer.Core)
        run: dotnet test --project tests/Lagerfeuer.Tests/Lagerfeuer.Tests.csproj -c Release

      - name: App bauen (x64)
        run: dotnet build src/Lagerfeuer/Lagerfeuer.csproj -c Release -p:Platform=x64

      - name: App bauen (ARM64)
        run: dotnet build src/Lagerfeuer/Lagerfeuer.csproj -c Release -p:Platform=ARM64

  # Baut aus installer/Lagerfeuer.nsi ein Probe-Setup mit winziger Nutzlast und prüft, dass es keine fremden
  # Programme startet, die neben ihm liegen (tests/installer/Test-Installer.ps1).
  installer:
    name: Setup-Prüfung
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: NSIS bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Setup prüfen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/installer/Test-Installer.ps1 -Work (Join-Path $env:RUNNER_TEMP 'setup-pruefung')
