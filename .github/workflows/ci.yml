# Tests und Build bei jedem Push auf main und bei Pull Requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # kein Token für Restore, Build und Tests (#59)

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Tests (Lagerfeuer.Core)
        run: dotnet test --project tests/Lagerfeuer.Tests/Lagerfeuer.Tests.csproj -c Release

      - name: App bauen (x64)
        run: dotnet build src/Lagerfeuer/Lagerfeuer.csproj -c Release -p:Platform=x64

      - name: App bauen (ARM64)
        run: dotnet build src/Lagerfeuer/Lagerfeuer.csproj -c Release -p:Platform=ARM64

  # Farben in src/Lagerfeuer/App.xaml gegen firestrike-branding (#68). Das Branding-Repo kommt auf einem festen
  # Commit dazu, nie über main. Einen neueren Commit zu übernehmen ist ein bewusster Schritt in diesem Repo.
  farben:
    name: Farben (firestrike-branding)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRANDING_COMMIT: 1d98a6abc6a79d83ea0fbf2a17716f4edb7f2091 # Tokens 1.2.0 mit WinUI-Export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nur lesen

      - name: firestrike-branding holen
        run: |
          git clone --quiet https://github.com/Celestial0579/firestrike-branding.git "$RUNNER_TEMP/marke"
          git -C "$RUNNER_TEMP/marke" checkout --quiet "$BRANDING_COMMIT"

      - name: App.xaml abgleichen
        run: python3 "$RUNNER_TEMP/marke/werkzeuge/marke.py" abgleichen src/Lagerfeuer/App.xaml

      # Der Abgleich sieht nur die Rollen (Fs…Color) und die Akzentreihe. Ein Pinsel oder Stil mit festem Farbwert
      # fiele ihm nicht auf (#94): Jeder Farbwert gehört in eine Rolle, die Pinsel zeigen darauf. Die Prüfung liest
      # alle XAML-Dateien als XML und erlaubt Hex-Werte nur für die Schlüssel, die der Export selbst führt (#96).
      - name: Keine festen Farbwerte neben den Rollen
        run: python3 build/farben-pruefen.py --export "$RUNNER_TEMP/marke/exporte/winui/Firestrike.xaml"

      # Die Prüffälle halten die Prüfung davon ab, bei späteren Änderungen still schwächer zu werden (#99).
      - name: Prüffälle der Farbprüfung
        run: python3 tests/farben/pruefe.py --export "$RUNNER_TEMP/marke/exporte/winui/Firestrike.xaml"

  # Baut aus installer/Lagerfeuer.nsi ein Probe-Setup mit winziger Nutzlast und prüft, dass es keine fremden
  # Programme startet, die neben ihm liegen (tests/installer/Test-Installer.ps1).
  installer:
    name: Setup-Prüfung
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # kein Token für Restore, Build und Tests (#59)

      - name: NSIS bereitstellen
        shell: pwsh
        run: ./build/Install-Nsis.ps1 # feste Version, geprüft über die Prüfsumme (#59)

      - name: Setup prüfen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/installer/Test-Installer.ps1 -Work (Join-Path $env:RUNNER_TEMP 'setup-pruefung')
